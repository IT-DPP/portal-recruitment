# =====================================================================
# Nginx Reverse Proxy Configuration for DPP Recruitment Portal
# Location on VM: /etc/nginx/sites-available/portal.dpp.co.id
# Enable with: sudo ln -s /etc/nginx/sites-available/portal.dpp.co.id /etc/nginx/sites-enabled/
# Issue SSL with: sudo certbot --nginx -d portal.dpp.co.id -d portal-staging.dpp.co.id
# =====================================================================

# --- 1. PRODUCTION: portal.dpp.co.id -> 127.0.0.1:3020 ---
server {
    listen 80;
    listen [::]:80;
    server_name portal.dpp.co.id;

    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# --- 2. STAGING (Optional): portal-staging.dpp.co.id -> 127.0.0.1:3021 ---
server {
    listen 80;
    listen [::]:80;
    server_name portal-staging.dpp.co.id;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
