# =====================================================================
# Nginx Reverse Proxy Configuration for DPP Recruitment Portal (STAGING)
# Location on VM: /etc/nginx/sites-available/recruitment-staging.dpp.co.id
# Enable with: sudo ln -sf /etc/nginx/sites-available/recruitment-staging.dpp.co.id /etc/nginx/sites-enabled/recruitment-staging.dpp.co.id
# Issue SSL with: sudo certbot --nginx -d recruitment-staging.dpp.co.id
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name recruitment-staging.dpp.co.id;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
