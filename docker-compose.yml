services:
  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-recruitment_portal}_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_db}
    ports:
      # Bound to localhost on DB_HOST_PORT (Prod: 5435, Staging: 5436) to avoid conflict with be_ehs_db (5432) and be_dashboard_db (5433)
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-recruitment_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-recruitment_portal}_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3020
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-recruitment_db}?schema=public
    ports:
      # Exposed on APP_HOST_PORT (Prod: 3020, Staging: 3021) to avoid conflict with crm-frontend (3000) and be_dashboard (3001)
      - "${APP_HOST_PORT:-3020}:3020"

volumes:
  postgres_data:
