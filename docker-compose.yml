services:
  db:
    image: postgres:15-alpine
    container_name: recruitment_portal_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost on DB_HOST_PORT (5435) to avoid conflict with be_ehs_db (5432) and be_dashboard_db (5433)
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_portal_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3020}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      # Exposed on APP_HOST_PORT (3020) to avoid conflict with crm-frontend (3000) and be_dashboard (3001)
      - "${APP_HOST_PORT:-3020}:${PORT:-3020}"

volumes:
  postgres_data:
